[package]
name = "nahida-tools"
version = "0.1.0"
description = "The tool set: read, write, edit, bash, find, grep, ls."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nahida-agent.workspace = true

async-trait.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio.workspace = true

# OS-level write confinement (Landlock) -- Linux only. See os_sandbox.rs for
# why macOS has no equivalent: Seatbelt is deprecated with no documented
# replacement for headless sandboxing, and known to break reqwest's default
# macOS proxy detection.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
